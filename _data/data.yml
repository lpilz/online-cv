      conference: "AGU General Assembly 2022"
    - title: Towards Carbon Dioxide emission estimation with a stationary hyperspectral camera
      link: "https://doi.org/10.5194/egusphere-egu22-3924"
      authors: M. Knapp, et al.
      conference: "EGU General Assembly 2022"
    - title: Hochaufgelöste Simulation von meteorologischen Feldern in urbanen Räumen mit dem Weather Research and Forecasting (WRF) Modell
      link: "https://doi.org/10.5194/dach2022-69"
