projects:

oss:
  title: OSS Contributions
  intro: >
    I initiated and co-led the <tt>xwrf</tt> development, enabling scalable WRF output analysis in xarray/dask and integrating it into the Pangeo ecosystem.
  contributions:
    - title: xwrf
      link: "https://github.com/xarray-contrib/xwrf"
      tagline: "A lightweight interface for working with the Weather Research and Forecasting (WRF) model output in Xarray."

    - title: wps_xr
      link: "https://github.com/lpilz/wps_xr"
      tagline: "A collection of tools to integrate WRF/WPS geogrid binary datasets into the xarray ecosystem."

    - title: portraitpy
      link: "https://github.com/ATMO-IUP-UHEI/portraitpy"
      tagline: "A matplotlib wrapper for creating portrait or Gleckler plots (Gleckler et al., 2008)"

publications:
  title: Publications
  intro: |
    I have authored and co-authored several peer-reviewed publications in the fields of environmental physics and climate science.
    I have furthermore published a high-resolution, high-fidelity dataset containing CO and CO<sub>2</sub> concentrations as well as meteorological fields over German metropolitan areas and Europe.
  papers:
    - title: "Designing urban CO<sub>2</sub> sensor networks under realistic uncertainties and biases: Results from synthetic studies in Berlin and Munich"
      authors: C. Lüken-Winkels, <b>L. Pilz</b>, S. N. Vardag
      conference: "Elementa: Science of the Anthropocene 2026 (accepted)"
    - title: Evaluation of high-resolution WRF simulation in urban areas — Effect of different physics schemes on simulation performance in the Rhine-Main-Neckar area
      link: "https://doi.org/10.1016/j.atmosres.2025.108435"
      authors: <b>L. Pilz</b>, C. Lüken-Winkels, M. Gałkowski, D. Ho, C. Gerbig, F. Chen, S. N. Vardag
      conference: "Atmospheric Research 2026"
    - title: MACRO-2018 - High-Resolution Simulation of CO and CO<sub>2</sub> concentrations over German Metropolitan Areas for 2018 using WRF-Chem
      link: "https://doi.org/10.26050/WDCC/MACRO-2018"
      authors: <b>L. Pilz</b>, H. Denier van der Gon, T. Glauch, J. Marshall, S. N. Vardag
      conference: "WDCC 2025"
    - title: Interlinkages between climate change impacts, public attitudes and climate action - Exploring trends before and after the Paris Agreement in the EU
      link: "https://doi.org/10.3390/su15097542"
      authors: T. Schwerdtle, E. Cavan, <b>L. Pilz</b>, S. Oggioni, A. Crosta, V. Kaleyeva, P. Karim, F. Szarvas, T. Naryniecki, M. Jungmann
      conference: "Sustainability 2023"

contributions:
  title: Conference Contributions
  intro: |
    I contributed to various conference contributions and publications during my studies.
    I also contributed to the development of the Tumble-Vortex Core Line Extraction algorithm, which is used to extract core lines from 3D flow fields and generated test datasets for that study.
  intro_print: |
    I have contributed to 10 conference contributions, including presentations at the EGU and AGU General Assembly (2021-2025, 2022), and DACH (2022). My contributions focus on urban CO<sub>2</sub> emissions monitoring as well as high-resolution modeling. I also contributed to the development of the Tumble-Vortex Core Line Extraction algorithm in a conference paper to SIGRAPI 2017.
  contributions:
    - title: Designing CO<sub>2</sub> sensor networks for German cities - Insights from synthetic studies in Berlin and Munich
      link: "http://doi.org/10.5194/egusphere-egu25-10382"
      authors: C. Lüken-Winkels, L. Pilz, et al.
      conference: "EGU General Assembly 2025"
    - title: High-resolution meteorological CO<sub>2</sub> enhancements of German metropolitan areas using WRF
      link: "https://doi.org/10.5194/egusphere-egu24-8915"
      authors: L. Pilz, C. Lüken-Winkels, et al.
      conference: "EGU General Assembly 2024"
    - title: A combined dataset of path-averaged and in-situ measurements of greenhouse gases to inform on the sensitivities to localized source patterns and transport effects in the urban atmosphere.
      link: "https://doi.org/10.5194/egusphere-egu24-11113"
      authors: T. Schmitt, L. Pilz, et al.
      conference: "EGU General Assembly 2024"
    - title: High-resolution inversion of Berlin city emissions – A synthetic study using FLEXPART-WRF for network optimization within ITMS
      link: "https://doi.org/10.5194/egusphere-egu24-9996"
      authors: C. Lüken-Winkels, L. Pilz, et al.
      conference: "EGU General Assembly 2024"
    - title: Long open-path measurements of CO<sub>2</sub> and CH<sub>4</sub> with an 125HR FTS in an urban environment.
      link: "https://doi.org/10.5194/egusphere-egu23-4403"
      authors: T. Schmitt, et al.
      conference: "EGU General Assembly 2023"
    - title: Optimizing High-Resolution Simulations with the Weather Research and Forecasting (WRF) Model for the German Rhine-Neckar Metropolitan Region
      link: "https://doi.org/10.22541/essoar.167591054.45628540/v1"
