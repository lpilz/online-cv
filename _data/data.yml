career-profile:
    title: Career Profile
    summary: |
      I am an environmental physicist with expertise in atmospheric modelling, data assimilation, and scientific programming. My PhD at Heidelberg University focussed on optimizing urban CO<sub>2</sub> emissions using high-resolution meteorological modeling. I combine strong computational and software engineering skills with a drive to make environmental science more quantitative, efficient, and actionable.
    # I am an environmental physicist with a background in programming and software engineering.
    # I am passionate about making science actionable and have a strong interest in high-performance computing and software development.
    # Currently, I am finishing my PhD at the Institute of Environmental Physics at Heidelberg University.
    # My thesis is aimed at improving urban CO<sub>2</sub> estimation using high-resolution meteorological modelling and data assimilation.
education:
  title: Education
  info:
    - degree: Dr. rer. nat. Physics (Grade magna cum laude 1.0)
      university: Institute of Environmental Physics, Heidelberg University
      time: 05/2021 - 01/2026
      details: |
        - Thesis: Monitoring urban greenhouse gas emissions using high-resolution models
        - Aim: Improving greenhouse gas emissions estimates of German metropolitan areas within the joint research project ITMS
        - Focus: Environmental physics, computational physics
        - Methods: high-resolution meteorological modelling, trace gas transport modelling, data assimilation
        - Skills: Python programming, Fortran development, high-performance computing, project management, independent work, data analysis, engaging with project collaborators and stakeholders, public communication of research
    - degree: MSc. Physics (Grade 1.4)
      university: Institute of Environmental Physics, Heidelberg University
      time: 09/2017 - 01/2021
      details: |
        - Thesis: Towards urban CO<sub>2</sub> emissions monitoring: Evaluation of network sensors and meso-scale modeling
        - Focus: Environmental physics, computational physics
        - Skills: Python programming, independent work, data analysis
    - degree: BSc. Physics (Grade 1.9)
      university: Kirchhoff Institute for Physics, Heidelberg University
      time: 09/2013 - 09/2017
      details: |
        - Thesis: Towards Fast Iterative Learning on the BrainScaleS Neuromorphic Hardware System
        - Focus: Computational physics, software engineering
        - Skills: C++ software engineering, independent work, data analysis


